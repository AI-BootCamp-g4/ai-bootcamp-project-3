[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digikala-assistant"
version = "0.1.0"
description = "QBC13 Digikala Intelligent Shopping Assistant"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "rank-bm25>=0.2.2,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
