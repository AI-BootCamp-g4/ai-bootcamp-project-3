[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digikala-assistant"
version = "0.1.0"
description = "QBC13 Digikala Intelligent Shopping Assistant"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "rank-bm25>=0.2.2,<1.0",
]

[project.optional-dependencies]
# Product comparison + manager analytics (src/digikala_assistant/comparison_analytics)
comparison = [
    "pyarrow>=15",
    "scipy>=1.11",
    "openai>=1.40",
    "huggingface_hub>=0.23",
    "streamlit>=1.35",
    "plotly>=5.20",
    "openpyxl>=3.1",
    "sentence-transformers>=3.0",
    "transformers>=4.51",
]

[tool.setuptools.packages.find]
where = ["src"]
